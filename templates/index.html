<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biometric Face Recognition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --success-bg: #ecfdf5;
            --success-text: #065f46;
            --error-bg: #fef2f2;
            --error-text: #991b1b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 15px;
        }

        .container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05), 0 4px 6px rgba(0, 0, 0, 0.02);
            text-align: center;
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
        }
        
        /* Drag and Drop Zone */
        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 50px 20px;
            background-color: #f8fafc;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .drop-zone:hover {
            border-color: var(--primary-color);
            background-color: #eff6ff;
        }

        .drop-zone.dragover {
            background-color: #e0e7ff;
            border-color: var(--primary-color);
            transform: scale(1.02);
        }

        .drop-zone i {
            font-size: 48px;
            color: #94a3b8;
            margin-bottom: 15px;
            transition: color 0.3s ease;
        }

        .drop-zone:hover i {
            color: var(--primary-color);
        }

        .drop-zone p { 
            margin: 0; 
            color: var(--text-muted); 
            font-size: 15px; 
            line-height: 1.5;
        }

        .drop-zone p b {
            color: var(--primary-color);
        }

        .drop-zone input[type="file"] { display: none; }
        
        /* Preview Area */
        .preview-container {
            display: none;
            margin-bottom: 20px;
            animation: fadeIn 0.5s;
        }

        #preview {
            max-width: 200px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 4px solid white;
        }

        /* Loading Spinner */
        .loader-container {
            display: none;
            margin: 20px 0;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px auto;
        }

        /* Result Panel */
        .result-box {
            padding: 20px;
            border-radius: 12px;
            display: none;
            text-align: left;
            animation: slideUp 0.4s ease-out;
            margin-top: 20px;
        }

        .result-header {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .success { 
            background-color: var(--success-bg); 
            border: 1px solid #a7f3d0; 
        }
        .success .result-header { color: var(--success-text); }

        .error { 
            background-color: var(--error-bg); 
            border: 1px solid #fecaca; 
        }
        .error .result-header { color: var(--error-text); }

        .distance-text { 
            font-size: 13px; 
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background: rgba(0,0,0,0.05);
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: 600;
        }

        /* Animations */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .footer {
            margin-top: auto;
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            padding-top: 20px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1><i class="fa-solid fa-face-viewfinder"></i> Biometric Auth</h1>
    <p>Pengenalan Wajah Berbasis PCA & Aljabar Linier</p>
</div>

<div class="container">
    
    <div class="drop-zone" id="drop-zone">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <p>Tarik & letakkan foto di sini<br>atau <b>Telusuri File</b></p>
        <input type="file" id="file-input" accept="image/*">
    </div>

    <div class="preview-container" id="preview-container">
        <img id="preview" alt="Preview Image">
    </div>

    <div class="loader-container" id="loader">
        <div class="loader"></div>
        <p style="color: var(--text-muted); font-size: 14px;">Menganalisis matriks wajah...</p>
    </div>

    <div id="result" class="result-box">
        <div class="result-header" id="result-message"></div>
        <div class="distance-text">
            <span id="result-desc">Jarak Euclidean:</span>
            <span class="badge" id="result-distance"></span>
        </div>
    </div>
</div>

<div class="footer">
    &copy; 2026 Sistem Pengenalan Wajah. Powered by Flask & OpenCV.
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const previewContainer = document.getElementById('preview-container');
    const preview = document.getElementById('preview');
    const resultBox = document.getElementById('result');
    const resultMessage = document.getElementById('result-message');
    const resultDistance = document.getElementById('result-distance');
    const resultDesc = document.getElementById('result-desc');
    const loader = document.getElementById('loader');

    // Memicu file input ketika drop zone di-klik
    dropZone.addEventListener('click', () => fileInput.click());

    // Menangani efek drag over
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });

    // Menangani file yang di-drop
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    // Menangani file dari input manual
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            handleFile(e.target.files[0]);
        }
    });

    function handleFile(file) {
        // Tampilkan preview gambar
        const reader = new FileReader();
        reader.onload = (e) => {
            preview.src = e.target.result;
            dropZone.style.display = 'none';
            previewContainer.style.display = 'block';
            resultBox.style.display = 'none';
            loader.style.display = 'block'; // Tampilkan spinner loading
        };
        reader.readAsDataURL(file);

        // Siapkan data untuk dikirim
        const formData = new FormData();
        formData.append('file', file);

        // Kirim ke backend Flask
        fetch('/upload', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            loader.style.display = 'none'; // Sembunyikan spinner
            resultBox.style.display = 'block';

            if (data.status === 'success') {
                resultBox.className = 'result-box success';
                resultMessage.innerHTML = `<i class="fa-solid fa-circle-check"></i> Dikenali: ${data.match.split('.')[0]}`; // Menghilangkan ekstensi .jpeg di UI
                resultDesc.innerHTML = "Jarak Euclidean:";
                resultDistance.innerHTML = data.distance;
            } else if (data.status === 'unknown') {
                resultBox.className = 'result-box error';
                resultMessage.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> Wajah Tidak Dikenali`;
                resultDesc.innerHTML = "Jarak Terdekat (Gagal):";
                resultDistance.innerHTML = data.distance;
            } else {
                resultBox.className = 'result-box error';
                resultMessage.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Error`;
                resultDesc.innerHTML = "Detail:";
                resultDistance.innerHTML = "Wajah tidak terdeteksi";
            }
            
            // Kembalikan ke tampilan awal setelah 5 detik agar bisa mencoba foto lain
            setTimeout(() => {
                previewContainer.style.display = 'none';
                resultBox.style.display = 'none';
                dropZone.style.display = 'block';
                fileInput.value = ''; // Reset input
            }, 5000);
        })
        .catch(error => {
            console.error('Error:', error);
            loader.style.display = 'none';
            resultBox.style.display = 'block';
            resultBox.className = 'result-box error';
            resultMessage.innerHTML = `<i class="fa-solid fa-server"></i> Server Error`;
            resultDesc.innerHTML = "Status:";
            resultDistance.innerHTML = "Gagal memproses";
        });
    }
</script>

</body>
</html>
